name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase
          
      - name: Build APK
        run: |
          cd src
          flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFlow-APK
          path: build/apk/outputs/flutter-apk/*.apk