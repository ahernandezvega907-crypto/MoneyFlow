[project]
name = "moneyflow"
version = "1.0.0"
description = "Aplicación de gestión de gastos personales"
authors = [
    { name = "Armando Hernandez", email = "soporte@moneyflow.com" }
]
dependencies = [
    "flet"
]
requires-python = ">=3.9"

[tool.flet]
org = "com.moneyflow"
product = "MoneyFlow"

[tool.flet.app]
path = "src"

[tool.flet.android]
app_name = "MoneyFlow"
package_name = "com.moneyflow.app"
icon = "assets/icon.png"

[tool.flet.windows]
icon = "assets/icon.png"