name: APK de Compilador MoneyFlow
on:
  push:
    branches:
      - principal
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flet y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compilar APK
        run: |
          # 1. Aceptamos licencias de Android por si acaso
          yes | flutter doctor --android-licenses || true
          
          # 2. Entramos a la carpeta src y compilamos el main.py que está ahí dentro
          # Usamos --template para asegurar que reconozca el proyecto móvil
          cd src && yes | flet build apk main.py --project "MoneyFlow"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFlow-App
          # Ajustamos la ruta porque ahora el build se genera dentro de src/
          path: src/build/apk/*.apk
