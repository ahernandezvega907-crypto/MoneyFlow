name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build APK
        run: |
          cd src
          yes | flet build apk
          echo "=== BUSCANDO TODOS LOS APK ==="
          find /home/runner -name "*.apk" 2>/dev/null
          echo "=== LISTANDO CONTENIDO DEL DIRECTORIO ACTUAL ==="
          ls -la
          echo "=== LISTANDO build ==="
          ls -la build/ 2>/dev/null || echo "No existe build/"
          echo "=== RECORRIENDO build ==="
          find build -type f 2>/dev/null | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFlow-APK
          path: '**/*.apk'
