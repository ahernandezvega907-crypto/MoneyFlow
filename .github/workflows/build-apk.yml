name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase

      - name: Build APK
        run: |
          ls -la
          if [ -d "src" ]; then
            echo "src directory found, entering..."
            cd src
            ls -la
            yes | flet build apk
          else
            echo "src directory not found"
            yes | flet build apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFlow-APK
          path: build/**/*.apk
