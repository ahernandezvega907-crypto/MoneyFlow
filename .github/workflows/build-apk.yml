name: Compilar MoneyFlow APK
on:
  push:
    branches:
      - principal # Tu rama actual según VS Code

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Java (Necesario para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flet y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]
          # Corregido a requirements.txt segun tu explorador de archivos
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compilar APK
        run: |
          # Comando corregido: sin --main y con nombre de proyecto
          flet build apk src/main.py --project "MoneyFlow"

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFlow-Android-App
          path: build/apk/*.apk
