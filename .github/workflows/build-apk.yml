name: APK de Compilador MoneyFlow
on:
  push:
    branches:
      - principal
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flet y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compilar APK
        run: |
          # Aceptamos licencias y compilamos con la ruta corregida
          yes | flet build apk src/main.py --project "MoneyFlow"
          
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFlow-App
          path: build/apk/*.apk
          
