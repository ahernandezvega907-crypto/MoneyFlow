name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase

      - name: Build APK
        run: |
          echo "=== Directorio raíz ==="
          ls -la
          
          if [ -d "src" ]; then
            echo "=== Directorio src encontrado, entrando... ==="
            cd src
            echo "=== Contenido de src ==="
            ls -la
            
            echo "=== Ejecutando flet build apk ==="
            yes | flet build apk
            
            echo "=== Buscando archivos APK generados ==="
            echo "Buscando en todo el proyecto:"
            find .. -name "*.apk" 2>/dev/null || echo "No se encontraron archivos .apk"
            
            echo "=== Estructura de la carpeta build (si existe) ==="
            ls -laR ../build/ 2>/dev/null || echo "No existe la carpeta build"
            
          else
            echo "=== Directorio src no encontrado, construyendo desde raíz ==="
            yes | flet build apk
            
            echo "=== Buscando archivos APK generados ==="
            find . -name "*.apk" 2>/dev/null || echo "No se encontraron archivos .apk"
            
            echo "=== Estructura de la carpeta build (si existe) ==="
            ls -laR build/ 2>/dev/null || echo "No existe la carpeta build"
          fi
          
          echo "=== Volviendo al directorio raíz para el upload ==="
          cd $GITHUB_WORKSPACE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFlow-APK
          path: '**/*.apk'
