name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flet y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi

      - name: Compilar APK
        run: |
          # 1. Aceptamos licencias de Android necesarias para compilar
          yes | flutter doctor --android-licenses || true
          
          # 2. Compilamos usando la configuración moderna de pyproject.toml
          flet build apk --output build

      - name: Subir APK terminada
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFlow-APK
          path: build/apk/*.apk